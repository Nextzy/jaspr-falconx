name: jaspr_falconx_core
description: A jaspr falcon package.
version: 4.4.0

environment:
  sdk: ">=3.13.0 <4.0.0"

workspace:
  - jaspr_falconnect
  - jaspr_falconx
  - jaspr_falmonitor
  - jaspr_falkit
  - jaspr_falserver
  - jaspr_falstore
  - jaspr_falmodel
  - jaspr_faltool

dev_dependencies:
  melos: ^8.10.0

melos:
  scripts:
    analyze:
      description: Run dart analyze across all packages.
      exec:
        command: dart analyze --fatal-infos
        concurrency: 4

    format:
      description: Run dart format across all packages.
      exec:
        command: dart format --output=none --set-exit-if-changed .
        concurrency: 4

    test:
      description: Run tests across all packages.
      exec:
        command: dart test
        concurrency: 4
        failFast: true
      packageFilters:
        dirExists: test

    build_runner:
      description: Run build_runner for code generation in all packages.
      exec:
        command: dart run build_runner build
        concurrency: 1
        failFast: false
      packageFilters:
        dependsOn: build_runner

    build_runner:check:
      description: Fail when any committed generated file differs from what build_runner would write; writes nothing.
      exec:
        command: dart run build_runner build --only-check
        concurrency: 1
        failFast: false
      packageFilters:
        dependsOn: build_runner

    build_runner:watch:
      description: Run build_runner watch for code generation.
      exec:
        command: dart run build_runner watch
        concurrency: 1
      packageFilters:
        dependsOn: build_runner

    get:
      description: Get the current package's dependencies.
      exec:
        command: dart pub get
        concurrency: 5

    upgrade:
      description: >-
        Upgrade every workspace member's dependencies within their constraints
        and raise each lower bound to the resolved version.
      run: dart pub upgrade --tighten

    outdated:
      description: Analyze your dependencies to find which ones can be upgraded.
      exec:
        command: dart pub outdated
        concurrency: 5

    check:exports:
      description: Fail when a barrel exports a name that collides with a dart library or jaspr and tool/export_check/bin/check.dart does not allowlist it.
      run: cd tool/export_check && dart pub get && dart run bin/check.dart

    check:exports:test:
      description: Analyze and test tool/export_check, which melos run analyze and melos run test skip.
      run: cd tool/export_check && dart pub get && dart analyze && dart test
